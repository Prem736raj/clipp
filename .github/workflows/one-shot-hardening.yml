          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit hardening changes back to branch
        shell: bash
        run: |
          git config user.name "Prem raj"
          git config user.email "prem736raj@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close production persistence and export gates [one-shot-hardening]"
          git push origin HEAD:astra/clipp-production-hardening

      - name: Install Android 36.1 SDK when available
        shell: bash
        run: |
          set +e
          if command -v android >/dev/null 2>&1; then
            yes | android sdk install "platforms;android-36.1"
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager "platforms;android-36.1"
          fi
          exit 0

      - name: Run JDK 21 unit, lint and assembly gates
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew --no-daemon testDebugUnitTest
          unit=$?
          ./gradlew --no-daemon lintDebug
          lint=$?
          ./gradlew --no-daemon assembleDebug
          debug=$?
          ./gradlew --no-daemon assembleDebugAndroidTest
          android_test_assembly=$?
          echo "unit=$unit lint=$lint assembleDebug=$debug assembleDebugAndroidTest=$android_test_assembly"
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            tail -n 80 app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi
          exit $(( unit != 0 || lint != 0 || debug != 0 || android_test_assembly != 0 ))
