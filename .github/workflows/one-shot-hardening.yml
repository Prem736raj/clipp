name: One-shot Clipp production hardening

on:
  push:
    branches:
      - astra/clipp-production-hardening

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/clipp-production-hardening
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android 36.1 SDK
        run: yes | sdkmanager "platforms;android-36.1"

      - name: Apply focused P0/P1 hardening
        run: python3 .github/scripts/apply_production_hardening.py

      - name: Validate patch shape
        run: git diff --check

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug app and instrumentation APK
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Commit verified hardening changes
        run: |
          git config user.name "Prem raj"
          git config user.email "prem736raj@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close production persistence and export gates"
          git push origin HEAD:astra/clipp-production-hardening
