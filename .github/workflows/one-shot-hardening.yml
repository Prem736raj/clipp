          replace_once(main_activity, old_multi, new_multi)

          exporter = 'app/src/main/java/com/example/VideoExporter.kt'
          anchor = '''internal const val MAX_AUDIO_LOOP_EXPORT_SEGMENTS = 4_096L

internal data class AudioExportSegment(
          '''
          replacement = '''internal const val MAX_AUDIO_LOOP_EXPORT_SEGMENTS = 4_096L

